services:

  db:
    image: postgres:16-alpine
    container_name: sisa-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: sisa_compras
      POSTGRES_USER: sisa
      POSTGRES_PASSWORD: sisa_pass_local
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisa -d sisa_compras"]
      interval: 5s
      timeout: 5s
      retries: 15

  backend:
    build:
      context: ./backend
    container_name: sisa-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://sisa:sisa_pass_local@db:5432/sisa_compras
      CORS_ORIGINS: http://localhost:4200
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: sisa-frontend
    restart: unless-stopped
    ports:
      - "4200:80"
    depends_on:
      - backend

volumes:
  pgdata:
  uploads_data:
