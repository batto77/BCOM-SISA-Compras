server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Logs a archivo real (la imagen base symlinkea a stdout/stderr por defecto).
    # Necesario para que fail2ban en el host pueda leerlos vía el volumen montado
    # en docker-compose.prod.yml (/var/log/sisa-nginx -> /var/log/nginx).
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log warn;

    # Angular HTML5 routing
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API → backend container
    location /api/ {
        proxy_pass         http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Archivos subidos por proveedores (fichas técnicas y PDFs)
    location /uploads/ {
        proxy_pass         http://backend:8000/uploads/;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_read_timeout 60s;
        client_max_body_size 20m;
    }
}
